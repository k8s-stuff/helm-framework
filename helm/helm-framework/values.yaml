# =============================================================================
# APPLICATION CONFIGURATION
# =============================================================================

# -- Core framework settings: config-file mount path/name.
helmFrameworkSettings:
  configPath: "/app"
  # Full name of the app config file mounted into the container (defaults to "appsettings.Production.json").
  configFileName: "appsettings.Production.json"

# -- App configuration rendered into a Secret and mounted as the config file.
appSettings: {}
# -- Plain environment variables (list of {name, value}). Set proxy vars (HTTPS_PROXY, NO_PROXY, ...) here too.
envVars: []
# -- Environment variables sourced from a Secret (map of key: value).
envVarsFromSecret: {}
