# -- TLS certificate mounted into the container from a Secret.
tls:
  enabled: false
  certFile: ""
  keyFile: ""
  mountPath: ""

# -- Istio AuthorizationPolicy entries (list; one AuthorizationPolicy resource per enabled entry, named <fullname>-<name>).
authorizationPolicy: []
