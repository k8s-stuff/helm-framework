name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    name: Helm Lint & Chart Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Set up Python (for ct)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Helm dependency update (test template chart)
        run: helm dependency update helm/helm-framework-test-template

      - name: Helm lint (test template chart)
        run: helm lint helm/helm-framework-test-template

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --chart-dirs helm

      - name: Install kubeconform
        run: curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform

      # helm lint/template only catch Go-template and chart-metadata errors, not
      # invalid apiVersions or malformed fields - validate the rendered output
      # against the real Kubernetes API schema. This chart also renders CRDs
      # (Istio VirtualService/AuthorizationPolicy, KEDA ScaledObject/
      # TriggerAuthentication, VerticalPodAutoscaler), so a second
      # schema-location falls back to the community CRDs-catalog for those.
      - name: Validate rendering against Kubernetes schema (kubeconform)
        working-directory: helm/helm-framework-test-template
        run: |
          set -eu
          KUBECONFORM="$GITHUB_WORKSPACE/kubeconform -strict -summary -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

          rendered_hpa=$(helm template helm-framework-test-template .)
          echo "$rendered_hpa"
          echo "$rendered_hpa" | $KUBECONFORM

          # KEDA and the HPA are mutually exclusive (chart fails fast if both
          # are enabled) - render a second time with KEDA on to independently
          # exercise the ScaledObject/TriggerAuthentication templates.
          rendered_keda=$(helm template helm-framework-test-template . --set keda.enabled=true --set horizontalPodAutoscaler.enabled=false)
          echo "$rendered_keda"
          echo "$rendered_keda" | $KUBECONFORM

      # helm-framework.probes used Helm's `default` filter on initialDelaySeconds,
      # but `default` treats numeric 0 as empty - a consumer explicitly setting
      # initialDelaySeconds: 0 silently got the library's hardcoded default
      # instead. Assert an explicit 0 survives rendering for all three probes.
      - name: "Regression test - explicit initialDelaySeconds: 0 must survive rendering"
        working-directory: helm/helm-framework-test-template
        run: |
          set -eu

          rendered_zero_delay=$(helm template helm-framework-test-template . \
            --set healthChecks.startupProbe.initialDelaySeconds=0 \
            --set healthChecks.livenessProbe.initialDelaySeconds=0 \
            --set healthChecks.readinessProbe.initialDelaySeconds=0)
          echo "$rendered_zero_delay"

          # `|| true` is required: grep -c exits 1 when the count is 0, which
          # under `set -e` would abort here and skip the diagnostic below.
          zero_count=$(echo "$rendered_zero_delay" | grep -c 'initialDelaySeconds: 0' || true)
          if [[ "$zero_count" -ne 3 ]]; then
            echo "::error::Expected 3 occurrences of 'initialDelaySeconds: 0' but found $zero_count. This means helm-framework.probes is using Helm's 'default' filter again, which treats an explicit 0 as empty and silently falls back to the hardcoded default (10/1/1) instead of honoring it - see _helpers.tpl's use of 'dig' for startup/liveness/readinessProbe.initialDelaySeconds."
            exit 1
          fi

      # Under controlledValues: RequestsOnly the container used to render with
      # limits and no requests. The API server then defaults requests to the
      # limits, which makes the pod Guaranteed QoS - and VPA can never lower
      # requests from there, because that changes QoS, which in-place resize
      # rejects ("Pod QOS Class may not change as a result of resizing"). The
      # net effect was every workload permanently reserving its full limit.
      # Assert requests survive alongside limits in this mode.
      - name: "Regression test - RequestsOnly must render requests alongside limits"
        working-directory: helm/helm-framework-test-template
        run: |
          set -eu

          rendered_vpa=$(helm template helm-framework-test-template . \
            --set resources.requests.cpu=200m \
            --set resources.requests.memory=512Mi \
            --set resources.limits.cpu=1 \
            --set resources.limits.memory=2Gi \
            --set verticalPodAutoscaler.enabled=true \
            --set verticalPodAutoscaler.updatePolicy.updateMode=InPlace \
            --set 'verticalPodAutoscaler.containerPolicies[0].containerName=*' \
            --set 'verticalPodAutoscaler.containerPolicies[0].controlledResources[0]=cpu' \
            --set 'verticalPodAutoscaler.containerPolicies[0].controlledResources[1]=memory' \
            --set 'verticalPodAutoscaler.containerPolicies[0].controlledValues=RequestsOnly')
          echo "$rendered_vpa"

          # `|| true` is required: grep -c exits 1 on a count of 0, which under
          # `set -e` would abort before the diagnostic below can run.
          req_count=$(echo "$rendered_vpa" | grep -c 'cpu: 200m' || true)
          if [[ "$req_count" -lt 1 ]]; then
            echo "::error::controlledValues: RequestsOnly rendered no resources.requests. A container with limits and no requests is Guaranteed QoS, which permanently blocks VPA from lowering requests - see the QoS note in _deployment.yaml."
            exit 1
          fi

      # The whole point of native Liquibase support is that application pods do
      # not start before the migration finishes. That guarantee lives in two
      # places that are easy to break independently: waitFor.active (which
      # provisions the RBAC and the ServiceAccount token) and the Deployment's
      # $waitForJobs list (which builds the kubectl wait arguments). Assert the
      # migration Job is actually waited on, and that the ConfigMaps and Secret
      # it depends on are hook-weighted ahead of it.
      - name: "Regression test - liquibase migration must block pod startup"
        working-directory: helm/helm-framework-test-template
        run: |
          set -eu

          rendered_lb=$(helm template helm-framework-test-template .)
          echo "$rendered_lb"

          # `|| true` is required: grep -c exits 1 on a count of 0, which under
          # `set -e` would abort before the diagnostic below can run.
          wait_count=$(echo "$rendered_lb" | grep -c 'job/helm-framework-test-template-liquibase' || true)
          if [[ "$wait_count" -lt 1 ]]; then
            echo "::error::The Deployment's wait-for-job init container does not reference the Liquibase Job. Application pods would start before the migration completes - see helm-framework.waitFor.active in _helpers.tpl and the \$waitForJobs list in _deployment.yaml. Note liquibase.waitForIt defaults to true, so an 'and \$lb.enabled \$lb.waitForIt' check silently skips it."
            exit 1
          fi

          rbac_count=$(echo "$rendered_lb" | grep -c 'helm-framework-test-template-wait-for-jobs' || true)
          if [[ "$rbac_count" -lt 2 ]]; then
            echo "::error::Expected a wait-for-jobs Role AND RoleBinding (2+ references) but found $rbac_count. Without them the init container cannot read Job status and pod startup hangs until the wait times out - see helm-framework.deployment.waitFor.rbac in _role.tpl."
            exit 1
          fi

          cm_weight=$(echo "$rendered_lb" | grep -c 'helm.sh/hook-weight: "-20"' || true)
          if [[ "$cm_weight" -lt 3 ]]; then
            echo "::error::Expected at least 3 resources at hook-weight -20 (changelog ConfigMap, migrations ConfigMap, credentials Secret) but found $cm_weight. At a weight >= the Job's -10 they would be created after it, and the migration pod would fail to mount them."
            exit 1
          fi

      # database.existingSecret is the only supported path for production
      # credentials. If the generated Secret is still rendered alongside it, a
      # plaintext password from values.yaml lands in the cluster anyway.
      - name: "Regression test - existingSecret must suppress the generated Secret"
        working-directory: helm/helm-framework-test-template
        run: |
          set -eu

          rendered_ext=$(helm template helm-framework-test-template . \
            --set liquibase.database.password=null \
            --set liquibase.database.existingSecret.name=external-db-credentials)
          echo "$rendered_ext"

          gen_count=$(echo "$rendered_ext" | grep -c 'name: helm-framework-test-template-liquibase-env' || true)
          if [[ "$gen_count" -ne 0 ]]; then
            echo "::error::database.existingSecret.name is set but the generated credentials Secret was still rendered ($gen_count references). See the existingSecret guard in _secret-liquibase.tpl."
            exit 1
          fi

          ref_count=$(echo "$rendered_ext" | grep -c 'name: "external-db-credentials"' || true)
          if [[ "$ref_count" -lt 2 ]]; then
            echo "::error::Expected the Job's username and password to both reference external-db-credentials (2 secretKeyRefs) but found $ref_count. See helm-framework.liquibase.env in _helpers.tpl."
            exit 1
          fi

      # envVars accepts a list of {name, value} or a map of NAME: value. The map
      # form exists for one reason: Helm replaces lists wholesale when merging
      # values files, so a deployment-time overlay adding HTTPS_PROXY used to
      # silently drop every variable the chart itself set. Maps merge key by key
      # instead. Assert that merge actually happens - inherit, add, override -
      # and that the list form (the only shape that can carry valueFrom) is
      # untouched by the normalizer.
      - name: "Regression test - map-form envVars must merge across values files, not replace"
        working-directory: helm/helm-framework-test-template
        run: |
          set -eu

          cat > /tmp/base-env.yaml <<'EOF'
          envVars:
            ASPNETCORE_ENVIRONMENT: "Production"
            TZ: "Europe/Stockholm"
          EOF
          cat > /tmp/overlay-env.yaml <<'EOF'
          envVars:
            HTTPS_PROXY: "webproxy.example:3128"
            TZ: "UTC"
          EOF

          rendered_env=$(helm template helm-framework-test-template . \
            -f /tmp/base-env.yaml -f /tmp/overlay-env.yaml)
          echo "$rendered_env"

          # Scope the assertions to the main container, so a match inside a
          # sidecar or Job cannot stand in for the container under test.
          main_env=$(echo "$rendered_env" | awk '/- name: helm-framework-test-template$/,/volumeMounts:/')

          for expected in 'name: ASPNETCORE_ENVIRONMENT' 'name: HTTPS_PROXY' 'value: UTC'; do
            if ! echo "$main_env" | grep -q "$expected"; then
              echo "::error::Expected '$expected' in the main container env after merging two map-form envVars files, but it is missing. The second -f file replaced the first instead of merging - see helm-framework.envVars.list in _helpers.tpl."
              exit 1
            fi
          done

          if echo "$main_env" | grep -q 'Europe/Stockholm'; then
            echo "::error::The overlay set TZ=UTC but the base value Europe/Stockholm survived. Map-form envVars must let a later values file override a key."
            exit 1
          fi

          # Non-string map values must be coerced: a container env value is a
          # string, and `PORT: 8080` is the obvious thing for a user to write.
          cat > /tmp/coerce-env.yaml <<'EOF'
          envVars:
            PORT: 8080
            DEBUG: true
          EOF
          coerced=$(helm template helm-framework-test-template . -f /tmp/coerce-env.yaml)
          for expected in 'value: "8080"' 'value: "true"'; do
            if ! echo "$coerced" | grep -q -- "$expected"; then
              echo "::error::Expected a coerced string $expected from map-form envVars, but it is missing. Non-string map values must be rendered as strings - see the toString in helm-framework.envVars.list."
              exit 1
            fi
          done

          # The list form is the only shape that can express valueFrom, so the
          # normalizer must pass it through untouched rather than flattening it.
          cat > /tmp/valuefrom-env.yaml <<'EOF'
          envVars:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          EOF
          vf=$(helm template helm-framework-test-template . -f /tmp/valuefrom-env.yaml)
          if ! echo "$vf" | grep -q 'fieldPath: status.podIP'; then
            echo "::error::List-form envVars lost its valueFrom block. helm-framework.envVars.list must pass the list shape through unmodified."
            exit 1
          fi

          # A map value that is not a scalar is almost always someone reaching
          # for valueFrom under the map form; it must fail with a clear message
          # rather than rendering a nested structure under `value:`.
          cat > /tmp/bad-env.yaml <<'EOF'
          envVars:
            POD_IP:
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          EOF
          if helm template helm-framework-test-template . -f /tmp/bad-env.yaml >/dev/null 2>&1; then
            echo "::error::A map-form envVars entry with a non-scalar value rendered successfully. It must fail validation - see the envVars shape check in _values-validation.tpl."
            exit 1
          fi
